[project]
name = "atlas-backend"
version = "0.1.0"
description = "Atlas AI backend: document ingestion, retrieval and grounded answers."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=25.1.0",
    "email-validator>=2",
    "fastapi>=0.115",
    "httpx2>=2.13.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "python-dotenv>=1.2.4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
